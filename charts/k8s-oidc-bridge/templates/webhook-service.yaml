apiVersion: v1
kind: Service
metadata:
  name: {{ include "obridge.webhook.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "obridge.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: webhook
  ports:
    - name: https
      port: 443
      targetPort: https
