{{- $controller := include "obridge.controller.fullname" . -}}
{{- $webhook := include "obridge.webhook.fullname" . -}}
# ---- controller ClusterRole ----
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $controller }}
  labels:
    {{- include "obridge.labels" . | nindent 4 }}
rules:
  # TokenBinding reconcile + status.
  - apiGroups: ["bridge.oidc.io"]
    resources: ["tokenbindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["bridge.oidc.io"]
    resources: ["tokenbindings/status"]
    verbs: ["get", "update", "patch"]
  # Load provider config.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Watch opt-in pods → targets for per-pod projection Secret fan-out (all ns).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Read provider secret + write source/per-pod projection Secret (all ns).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # k8s Events (the Recorder writes to events.k8s.io/v1).
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # TokenRequest — a cluster-takeover primitive, so scope it (spec §4.4).
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
    {{- if not .Values.rbac.clusterWide }}
    resourceNames:
      {{- toYaml .Values.rbac.serviceAccountNames | nindent 6 }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $controller }}
  labels:
    {{- include "obridge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $controller }}
subjects:
  - kind: ServiceAccount
    name: {{ $controller }}
    namespace: {{ .Release.Namespace }}
---
# leader election lease (install ns).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $controller }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "obridge.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $controller }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "obridge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $controller }}
subjects:
  - kind: ServiceAccount
    name: {{ $controller }}
    namespace: {{ .Release.Namespace }}
---
# ---- webhook ClusterRole (read projection spec) ----
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $webhook }}
  labels:
    {{- include "obridge.labels" . | nindent 4 }}
rules:
  - apiGroups: ["bridge.oidc.io"]
    resources: ["tokenbindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $webhook }}
  labels:
    {{- include "obridge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $webhook }}
subjects:
  - kind: ServiceAccount
    name: {{ $webhook }}
    namespace: {{ .Release.Namespace }}
