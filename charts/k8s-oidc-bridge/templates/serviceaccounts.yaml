apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "obridge.controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "obridge.labels" . | nindent 4 }}
{{- with .Values.pullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "obridge.webhook.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "obridge.labels" . | nindent 4 }}
{{- with .Values.pullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
