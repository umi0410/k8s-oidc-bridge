apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tokenbindings.bridge.oidc.io
spec:
  group: bridge.oidc.io
  names:
    kind: TokenBinding
    plural: tokenbindings
    shortNames:
    - tbind
    singular: tokenbinding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerRef
      name: Provider
      type: string
    - jsonPath: .spec.serviceAccountName
      name: SA
      type: string
    - jsonPath: .status.nextRenewTime
      name: NextRenew
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for TokenBindingSpec via `CustomResource`
        properties:
          spec:
            properties:
              audience:
                description: audience override (defaults to the provider's when unset).
                nullable: true
                type: string
              projection:
                default:
                  env: []
                  mode: tokenFile
                  tokenFilePath: /var/run/secrets/oidc-bridge/token
                description: Pod projection config.
                properties:
                  env:
                    default: []
                    description: Per-consumer env override. Empty means the per-mode preset.
                    items:
                      description: |-
                        A single env mapping. If `valueFromTokenFile=true`, the token file path is used as
                        the value; otherwise the `value` literal is used.
                      properties:
                        name:
                          type: string
                        value:
                          nullable: true
                          type: string
                        valueFromTokenFile:
                          default: false
                          type: boolean
                      required:
                      - name
                      type: object
                    type: array
                  mode:
                    default: tokenFile
                    description: Projection mode.
                    enum:
                    - tokenFile
                    - awsCredentialsFile
                    type: string
                  tokenFilePath:
                    default: /var/run/secrets/oidc-bridge/token
                    type: string
                type: object
              providerRef:
                description: Provider key in the provider ConfigMap.
                type: string
              renew:
                default:
                  backoff:
                    baseSeconds: 1
                    capSeconds: 300
                    jitter: true
                  thresholdPercent: 50
                properties:
                  backoff:
                    default:
                      baseSeconds: 1
                      capSeconds: 300
                      jitter: true
                    properties:
                      baseSeconds:
                        default: 1
                        format: uint64
                        minimum: 0.0
                        type: integer
                      capSeconds:
                        default: 300
                        format: uint64
                        minimum: 0.0
                        type: integer
                      jitter:
                        default: true
                        type: boolean
                    type: object
                  thresholdPercent:
                    default: 50
                    description: Proactive renewal threshold (%). Default 50%.
                    format: uint32
                    minimum: 0.0
                    type: integer
                type: object
              scope:
                description: scope override.
                nullable: true
                type: string
              serviceAccountName:
                description: SA to exchange (same ns). The controller issues this SA's token via TokenRequest.
                type: string
            required:
            - providerRef
            - serviceAccountName
            type: object
          status:
            nullable: true
            properties:
              conditions:
                items:
                  description: k8s standard Condition (schema-compatible fields). Timestamps are RFC3339 strings.
                  properties:
                    last_transition_time:
                      type: string
                    message:
                      type: string
                    observed_generation:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - last_transition_time
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              expiryTime:
                nullable: true
                type: string
              issuedAt:
                nullable: true
                type: string
              lastError:
                nullable: true
                type: string
              lastRenewTime:
                nullable: true
                type: string
              nextRenewTime:
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              projectionSecretName:
                nullable: true
                type: string
              renewFailures:
                default: 0
                format: int64
                type: integer
            type: object
        required:
        - spec
        title: TokenBinding
        type: object
    served: true
    storage: true
    subresources:
      status: {}
