name: Dependabot auto-merge

# Auto-merge Dependabot PRs once CI passes. The CI workflow's `test` job runs on every PR;
# this enables GitHub auto-merge, which holds the PR until required checks pass, then squash-merges.
#
# Requires two one-time repo settings (Settings → General / Branches):
#   1. "Allow auto-merge" enabled.
#   2. A branch protection rule on `main` that requires the `test` status check.
# Without (2), auto-merge would merge before tests finish. Major version bumps are never
# auto-merged — they wait for a human.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      - name: Enable auto-merge (minor & patch only)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
