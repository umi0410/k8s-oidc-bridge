name: CI

# Every push/PR runs the test job. The image is built and pushed to GHCR only on
# a push to `main`, so branches and PRs stay test-only.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Helm lint
        uses: azure/setup-helm@v4
        with:
          version: latest
      - run: helm lint charts/k8s-oidc-bridge

  image:
    # Build + push only when main advances. Needs a green test job first.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Pushes to the morgo-bot-owned package, so it logs in as that owner with a
      # classic PAT (the repo's own GITHUB_TOKEN can't write another owner's packages).
      # Secrets: GHCR_USERNAME (= morgo-bot) and GHCR_TOKEN (classic PAT, write:packages).
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/morgo-bot/k8s-oidc-bridge:main
            ghcr.io/morgo-bot/k8s-oidc-bridge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
