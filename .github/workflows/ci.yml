name: CI

# Every push/PR runs the test job and builds the image. The image is pushed to GHCR
# only on a push to `main`; on PRs it is built (not pushed) as a validation check.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Helm lint
        uses: azure/setup-helm@v4
        with:
          version: latest
      - run: helm lint charts/k8s-oidc-bridge

  image:
    # Always build (validates the Dockerfile + the deps actually compile in the release build).
    # Push only when main advances. Needs a green test job first.
    needs: test
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Only needed to push. Pushes to the morgo-bot-owned package, so it logs in as that
      # owner with a classic PAT (the repo's own GITHUB_TOKEN can't write another owner's
      # packages). Secrets: GHCR_USERNAME (= morgo-bot) and GHCR_TOKEN (classic PAT, write:packages).
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build (push only on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH }}
          tags: |
            ghcr.io/morgo-bot/k8s-oidc-bridge:main
            ghcr.io/morgo-bot/k8s-oidc-bridge:${{ github.sha }}
          cache-from: type=gha
          # Only write the cache on main — fork PRs can't write the gha cache.
          cache-to: ${{ env.PUSH == 'true' && 'type=gha,mode=max' || '' }}
