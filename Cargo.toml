[workspace]
resolver = "2"
members = ["crates/common", "crates/controller", "crates/webhook"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/umi0410/k8s-oidc-bridge"

[workspace.dependencies]
# operator / CRD runtime
kube = { version = "4.2", default-features = false, features = [
    "client",
    "derive",
    "runtime",
    "admission",
    "rustls-tls",
    "ring",
] }
k8s-openapi = { version = "0.28", features = ["latest"] }
kube-leader-election = "0.44"
schemars = "1"

# web / admission server
axum = "0.8"
# tls-rustls-no-provider avoids a forced provider (aws-lc-rs); the provider is unified to ring below.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
tower = "0.5"
hyper = "1"
# rustls CryptoProvider — pin the tree to the ring-only backend (removes aws-lc-sys's C/asm build).
# Each binary's main explicitly installs the ring provider.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }

# http client + oidc/oauth
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
openidconnect = "4"
jsonwebtoken = "11"
json-patch = "4"

# retry / backoff
backon = "1"

# metrics / tracing
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = [
    "http-listener",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# serde / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# errors / time / async
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "serde",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
async-trait = "0.1"
futures = "0.3"

quick-xml = "0.37"

# dev
wiremock = "0.6"

[workspace.lints.clippy]
# keep the tree warning-clean under `-D warnings`
all = "warn"
